services:
  api:
    build:
      context: ../
      dockerfile: ./build/package/api/Dockerfile
    container_name: docssistant_api
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      API_PORT: 3000
      API_RELOAD: 'false'
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-document_chunks_nomic_v1}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DESCRIPTION: '${DESCRIPTION:-Docssistant is a document chat assistant that uses retrieval-augmented generation (RAG) to answer questions about your documents and cite its sources.}'
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-180}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_TIMEOUT: ${OLLAMA_EMBEDDING_TIMEOUT:-60}
      POSTGRES_DB: ${POSTGRES_DB:-docssistant}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      TITLE: ${TITLE:-Docssistant}
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/healthcheck' ]
      interval: 15s
      retries: 10
      start_period: 30s
      timeout: 5s
    image: kieranroneill/docssistant-api:production
    networks:
      - docssistant_network
    restart: unless-stopped
    volumes:
      # the api serves the original file behind a citation, so it reads the same documents
      - ${DOCUMENTS_PATH:-../.documents}:/app/.documents:ro

  chroma:
    build:
      context: ../
      dockerfile: ./build/package/chroma/Dockerfile
    container_name: docssistant_chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/v2/heartbeat' ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    image: kieranroneill/docssistant-chroma:production
    networks:
      - docssistant_network
    restart: unless-stopped
    volumes:
      - chroma_data:/data

  indexer:
    build:
      context: ../
      dockerfile: ./build/package/indexer/Dockerfile
    container_name: docssistant_indexer
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-document_chunks_nomic_v1}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_TIMEOUT: ${OLLAMA_EMBEDDING_TIMEOUT:-60}
      POSTGRES_DB: ${POSTGRES_DB:-docssistant}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
    image: kieranroneill/docssistant-indexer:production
    networks:
      - docssistant_network
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${DOCUMENTS_PATH:-../.documents}:/app/.documents:ro

  ollama:
    build:
      context: ../
      dockerfile: ./build/package/ollama/Dockerfile
    container_name: docssistant_ollama
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:11434/api/tags']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    image: kieranroneill/docssistant-ollama:production
    networks:
      - docssistant_network
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  postgres:
    container_name: docssistant_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docssistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB:-docssistant} -U ${POSTGRES_USER:-postgres}']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - docssistant_network
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      args:
        VITE_DESCRIPTION: '${DESCRIPTION:-Docssistant is a document chat assistant that uses retrieval-augmented generation (RAG) to answer questions about your documents and cite its sources.}'
        VITE_LOG_LEVEL: ${LOG_LEVEL:-ERROR}
        VITE_TITLE: ${TITLE:-Docssistant}
      context: ../
      dockerfile: ./build/package/web/Dockerfile
    container_name: docssistant_web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/healthcheck']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    image: kieranroneill/docssistant-web:production
    networks:
      - docssistant_network
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped

  ###
  # tools
  ###

  alembic:
    build:
      context: ../
      dockerfile: ./build/package/alembic/Dockerfile
    container_name: docssistant_alembic
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docssistant}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    image: kieranroneill/docssistant-alembic:production
    networks:
      - docssistant_network
    profiles: [ 'tools' ]

networks:
  docssistant_network:
    name: docssistant_network

volumes:
  chroma_data:
    name: docssistant_chroma_data
  ollama_models:
    name: docssistant_ollama_models
  postgres_data:
    name: docssistant_postgres_data
