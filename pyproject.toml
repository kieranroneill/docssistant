[project]
name = "docssistant"
version = "1.2.0"
description = "Docssistant is a document chat assistant that uses retrieval-augmented generation (RAG) to answer questions about your documents and cite its sources."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = [ "LICENSE" ]
requires-python = ">=3.12"

[[project.authors]]
name = "Kieran O'Neill"
email = "hello@kieranoneill.com"

[build-system]
requires = [ "setuptools>=77", "wheel" ]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = [ "py312" ]

[tool.mypy]
python_version = "3.12"
files = [ "api", "indexer", "libs", "test" ]
explicit_package_bases = true
mypy_path = "."
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "test.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "api", "api.*", "indexer", "indexer.*", "libs", "libs.*" ]
