[project]
name = "docssistant"
version = "1.1.0"
description = "Docssistant is a document chat assistant that uses retrieval-augmented generation (RAG) to answer questions about your documents and cite its sources."
readme = "README.md"
requires-python = ">=3.12"

[[project.authors]]
name = "Kieran O'Neill"
email = "hello@kieranoneill.com"

[build-system]
requires = [ "setuptools>=68", "wheel" ]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = [ "py312" ]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "api", "api.*", "indexer", "indexer.*", "libs", "libs.*" ]
