[project]
name = "docssistant"
version = "1.0.0"
description = "Docssistant provides."
authors = [
  { name = "Kieran O'Neill", email = "hello@kieranoneill.com" }
]
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api", "api.*", "indexer", "indexer.*", "libs", "libs.*"]
