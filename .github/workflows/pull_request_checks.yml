name: 'Pull Request Checks'

on:
  pull_request:

jobs:
  ##
  # lint
  ##

  lint_py:
    name: 'Lint: Python'
    runs-on: ubuntu-latest
    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v4
      - name: '🐍 Setup Python'
        uses: ./.github/actions/use-python-dependencies
      - name: '👕 Lint'
        run: python -m flake8 .

  ##
  # tests
  ##

  test_py_integration:
    name: 'Integration Tests: Python'
    runs-on: ubuntu-latest
    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v4
      - name: '🐍 Setup Python'
        uses: ./.github/actions/use-python-dependencies
      - name: '🧪 Test'
        run: ./scripts/test_py_integration.bash

  test_py_unit:
    name: 'Unit Tests: Python'
    runs-on: ubuntu-latest
    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v4
      - name: '🐍 Setup Python'
        uses: ./.github/actions/use-python-dependencies
      - name: '🧪 Test'
        run: python -m pytest test/unit
