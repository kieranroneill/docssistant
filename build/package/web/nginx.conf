server {
    listen 8080;
    server_name _;

    # docker's embedded dns, so the api is resolved per request rather than once at startup — nginx
    # then starts whether or not the api is up yet, and follows it if the container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    # redirects stay relative, as nginx would otherwise build them from its own listen port and send
    # clients to 8080 whatever port the container is published on
    absolute_redirect off;

    # the spa is built with a base of "/app", so send the bare host there
    location = / {
        return 302 /app/;
    }

    # proxied to the api service, as the frontend calls "/api" relative to its own origin
    location /api/ {
        # held in a variable, which is what defers resolution to request time
        set $api_upstream 'http://api:3000';

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # answers stream token by token, so no buffering and no early timeout
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthcheck {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # hashed filenames, so they can be cached indefinitely
    location /app/assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }

    location /app {
        root /usr/share/nginx/html;

        # client-side routing, so unknown paths fall back to the entry point
        try_files $uri $uri/ /app/index.html;

        # the entry point itself must never be cached, or clients pin to a stale build
        location = /app/index.html {
            add_header Cache-Control 'no-store';
        }
    }

    gzip on;
    gzip_proxied any;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    gzip_vary on;
}
